spring:
  application:
    name: payrail-simulator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payrail_db}}
    username: ${SPRING_DATASOURCE_USERNAME:payrail_user}
    password: ${SPRING_DATASOURCE_PASSWORD:payrail_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

# PayRail Simulator domain configurations
payrail:
  simulator:
    name: PayRail Synthetic Payment Processing & Ledger Simulator
    disclaimer: Synthetic-only educational simulator. No real money or bank integration.
  seed:
    enabled: false
  topics:
    transfer-commands: ${PAYRAIL_TOPICS_TRANSFER_COMMANDS:payrail.transfer-commands.v1}
    transfer-commands-dlq: ${PAYRAIL_TOPICS_TRANSFER_COMMANDS_DLQ:payrail.transfer-commands.dlq.v1}
  outbox:
    batch-size: ${PAYRAIL_OUTBOX_BATCH_SIZE:50}
    lease-duration: ${PAYRAIL_OUTBOX_LEASE_DURATION:10s}
    poll-interval: ${PAYRAIL_OUTBOX_POLL_INTERVAL:500ms}
    max-retries: ${PAYRAIL_OUTBOX_MAX_RETRIES:5}
  processing:
    manual-endpoint-enabled: ${PAYRAIL_PROCESSING_MANUAL_ENDPOINT_ENABLED:false}
    lease-duration: ${PAYRAIL_PROCESSING_LEASE_DURATION:30s}
    max-attempts: ${PAYRAIL_PROCESSING_MAX_ATTEMPTS:5}
    initial-backoff: ${PAYRAIL_PROCESSING_INITIAL_BACKOFF:1s}
    max-backoff: ${PAYRAIL_PROCESSING_MAX_BACKOFF:60s}
    recovery-sweep-interval: ${PAYRAIL_PROCESSING_RECOVERY_SWEEP_INTERVAL:15s}
  reconciliation:
    interval: ${PAYRAIL_RECONCILIATION_INTERVAL:60s}
    stale-processing-threshold: ${PAYRAIL_RECONCILIATION_STALE_PROCESSING_THRESHOLD:60s}
    stale-outbox-threshold: ${PAYRAIL_RECONCILIATION_STALE_OUTBOX_THRESHOLD:30s}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [cid:%X{correlationId:-none}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.payrail: ${LOG_LEVEL_COM_PAYRAIL:DEBUG}
    org.springframework.web: INFO
    org.flywaydb: INFO
