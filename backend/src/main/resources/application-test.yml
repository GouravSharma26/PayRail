# Test profile configuration
spring:
  flyway:
    enabled: true
    clean-disabled: true

payrail:
  seed:
    enabled: false
  outbox:
    publisher-enabled: false
    poll-interval: 100ms
  processing:
    manual-endpoint-enabled: true
    consumer-enabled: false
    recovery-sweep-enabled: false
    recovery-sweep-interval: 500ms

logging:
  level:
    root: WARN
    com.payrail: DEBUG
